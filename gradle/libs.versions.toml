[versions]
spring-boot = "4.1.1"
spotless = "8.10.3"
google-java-format = "1.36.1"
errorprone = "2.50.0"
errorprone-plugin = "5.1.1"
nullaway = "0.14.2"
jacoco = "0.8.15"
springdoc = "3.1.1"
# Must equal the Jackson 3 version managed by the Spring Boot BOM; verifyJacksonAlignment checks it.
# See docs/adr/0006.
jackson = "3.1.5"
# 3.0.7 needs Jackson 3.2; stays on the 3.1 line until Spring Boot moves (docs/adr/0006).
json-schema-validator = "3.0.6"
# ocpp-protocol has no Spring Boot BOM: it stays on JUnit Platform 1.x for jqwik.
junit5 = "5.14.4"
jqwik = "1.10.1"
# Same version as the Spring Boot BOM.
assertj = "3.27.7"

[libraries]
# Versions come from the Spring Boot BOM.
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jspecify = { module = "org.jspecify:jspecify" }
mockito-core = { module = "org.mockito:mockito-core" }
snakeyaml = { module = "org.yaml:snakeyaml" }

# ocpp-protocol, outside the Spring Boot BOM.
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
junit5-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

# Compiler plugins.
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

# Gradle plugins applied by the build-logic convention plugins.
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
