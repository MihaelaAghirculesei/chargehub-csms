name: chargehub

services:
  postgres:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: csms
      POSTGRES_USER: csms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy deploy/.env.example to deploy/.env}
    ports:
      # Loopback only: ports published by Docker bypass the host firewall.
      - "127.0.0.1:5432:5432"
    volumes:
      # Since PostgreSQL 18 the image declares its volume here, not at /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csms -d csms"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
