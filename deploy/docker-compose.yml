name: chargehub

services:
  postgres:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: csms
      POSTGRES_USER: csms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy deploy/.env.example to deploy/.env}
    ports:
      # Loopback only: ports published by Docker bypass the host firewall.
      - "127.0.0.1:5432:5432"
    volumes:
      # Since PostgreSQL 18 the image declares its volume here, not at /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csms -d csms"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    # Development mode with its built-in storage: the realm will be versioned as code, so the
    # container state is disposable.
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?copy deploy/.env.example to deploy/.env}
      KC_HEALTH_ENABLED: "true"
    ports:
      # 8080 is taken by the application.
      - "127.0.0.1:8180:8080"
    healthcheck:
      # The image ships neither curl nor wget; bash can open a TCP connection by itself.
      # /health/ready is served on the management port 9000.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && read -r status_line <&3
          && [[ $$status_line == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Behind profiles, so a plain `docker compose up` starts only the infrastructure and the
  # application can still run on the host with bootRun.
  csms:
    profiles: [app, sim]
    build:
      context: ..
      args:
        MODULE: csms-app
    image: chargehub/csms-app:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/csms
      SPRING_DATASOURCE_USERNAME: csms
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?copy deploy/.env.example to deploy/.env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Readiness turns true once the application accepts traffic, and false again on shutdown.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && read -r status_line <&3
          && [[ $$status_line == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # The Phase 2 demo: `docker compose --profile sim up` starts 100 charge points against csms.
  simulator:
    profiles: [sim]
    build:
      context: ..
      args:
        MODULE: charge-point-simulator
    image: chargehub/charge-point-simulator:local
    environment:
      CHARGEHUB_SIMULATOR_CENTRAL_SYSTEM: ws://csms:8080/ocpp
      CHARGEHUB_SIMULATOR_CHARGE_POINTS_COUNT: 100
    # The charge points reconnect by themselves, but connecting before the central system is
    # ready would only fill the log with back-off messages.
    depends_on:
      csms:
        condition: service_healthy

volumes:
  pgdata:
