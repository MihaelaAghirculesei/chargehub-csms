name: chargehub

services:
  postgres:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: csms
      POSTGRES_USER: csms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy deploy/.env.example to deploy/.env}
    ports:
      # Loopback only: ports published by Docker bypass the host firewall.
      - "127.0.0.1:5432:5432"
    volumes:
      # Since PostgreSQL 18 the image declares its volume here, not at /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csms -d csms"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    # Development mode with its built-in storage: the realm will be versioned as code, so the
    # container state is disposable.
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?copy deploy/.env.example to deploy/.env}
      KC_HEALTH_ENABLED: "true"
    ports:
      # 8080 is taken by the application.
      - "127.0.0.1:8180:8080"
    healthcheck:
      # The image ships neither curl nor wget; bash can open a TCP connection by itself.
      # /health/ready is served on the management port 9000.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && read -r status_line <&3
          && [[ $$status_line == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

volumes:
  pgdata:
