name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, because new queries find issues in code that has not changed. Minute 17 avoids the
    # load at the top of the hour.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Needed to upload results to code scanning; nothing else is writable.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          # A real compilation instead of buildless extraction: same compiler, same Java 25 code.
          build-mode: manual
          queries: security-extended

      # CodeQL traces the compiler, so compilation must happen in this process: no daemon, and no
      # build cache that could skip it.
      - run: ./gradlew --no-daemon --no-build-cache compileJava compileTestJava

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
