name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository; a leaked token cannot push or edit issues.
permissions:
  contents: read

# A new push to a pull request makes the running build obsolete. Builds on main
# always complete so every commit on main has a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Empty for pull requests from forks and from Dependabot, which get no repository secrets.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarQube Cloud needs the full history to tell new code from old code.
          fetch-depth: 0

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      # Also validates the wrapper jar checksum and caches Gradle state.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - run: ./gradlew build

      # Without the token there is nothing to report to, so the step is skipped instead of failing.
      - name: SonarQube Cloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: ./gradlew sonar

      # Reports matter most when the build fails, so they are uploaded in every case.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14

  compose:
    name: compose
    runs-on: ubuntu-24.04
    # The images of the central system and the simulator are built here from scratch,
    # dependencies included.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image build downloads its Gradle dependencies inside Docker, where the cache of the
      # build job cannot reach them. Downloading everything on every run made Maven Central
      # answer the shared runners with 429 Too Many Requests and fail the job at random.
      - name: Restore the Gradle dependencies of the image build
        id: image-gradle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-gradle
          key: image-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          # An older set still saves most downloads when one version changes.
          restore-keys: image-gradle-

      - name: Put them in the cache mount of the image build
        if: ${{ steps.image-gradle.outputs.cache-matched-key != '' }}
        run: .github/scripts/image-gradle-cache.sh seed "$RUNNER_TEMP/image-gradle"

      - name: Verify that both images build without network
        if: ${{ steps.image-gradle.outputs.cache-hit == 'true' }}
        run: |
          docker build --network=none --build-arg MODULE=csms-app .
          docker build --network=none --build-arg MODULE=charge-point-simulator .

      # --wait returns only when every service reports healthy, so a broken healthcheck or an
      # image that does not build fails here. The sim profile includes the central system.
      - run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml --profile sim up --detach --wait --wait-timeout 900

      # Saved only when the build files changed, so an unchanged set is not uploaded again.
      - name: Take the dependencies out of the cache mount
        if: ${{ steps.image-gradle.outputs.cache-hit != 'true' }}
        run: .github/scripts/image-gradle-cache.sh extract "$RUNNER_TEMP/image-gradle"

      - name: Save the Gradle dependencies of the image build
        if: ${{ steps.image-gradle.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-gradle
          key: ${{ steps.image-gradle.outputs.cache-primary-key }}

      # The definition of done of Phase 2, checked on every change.
      - name: 100 simulated charge points stay connected
        run: deploy/check-simulated-charge-points.sh 100 60

      - if: ${{ failure() }}
        run: docker compose -f deploy/docker-compose.yml --profile sim logs
