name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository; a leaked token cannot push or edit issues.
permissions:
  contents: read

# A new push to a pull request makes the running build obsolete. Builds on main
# always complete so every commit on main has a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      # Also validates the wrapper jar checksum and caches Gradle state.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - run: ./gradlew build

      # Reports matter most when the build fails, so they are uploaded in every case.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14

  compose:
    name: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --wait returns only when every service reports healthy, so a broken healthcheck fails here.
      - run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml up --detach --wait --wait-timeout 300

      - if: ${{ failure() }}
        run: docker compose -f deploy/docker-compose.yml logs
