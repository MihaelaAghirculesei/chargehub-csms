version: 2

updates:
  # Covers the version catalog, build-logic and the Gradle wrapper.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Rome
    # Gives a bad release time to be pulled before it reaches us. Security updates skip the wait.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      # Jackson and json-schema-validator move with Spring Boot: verifyJacksonAlignment
      # fails any update that changes only one of them (docs/adr/0006).
      spring:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework.modulith*"
          - "tools.jackson*"
          - "com.networknt*"
          - "org.jspecify*"
      test:
        patterns:
          - "org.junit*"
          - "net.jqwik*"
          - "org.assertj*"
          - "com.tngtech.archunit*"
      build-tools:
        patterns:
          - "com.diffplug.spotless*"
          - "com.google.googlejavaformat*"
          - "com.google.errorprone*"
          - "net.ltgt.gradle*"
          - "com.uber.nullaway*"
          - "org.jacoco*"
          - "org.sonarqube*"
    ignore:
      # A Spring Boot minor or major upgrade is planned work, not a weekly bump.
      # Spring Modulith follows the Boot line (2.1 goes with Boot 4.1).
      - dependency-name: "org.springframework.boot*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.springframework.modulith*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Jackson is always the version Spring Boot manages, patches included (docs/adr/0006).
      # When a Boot patch moves it, verifyJacksonAlignment fails that pull request and the
      # catalog is aligned there.
      - dependency-name: "tools.jackson*"
      # 3.0.7 needs Jackson 3.2. Remove this when Spring Boot moves to Jackson 3.2 (docs/adr/0006).
      - dependency-name: "com.networknt:json-schema-validator"
        versions: [">= 3.0.7"]
      # Spotless cannot run 1.37 yet (diffplug/spotless#3126). Remove with #42.
      - dependency-name: "com.google.googlejavaformat:google-java-format"
        versions: [">= 1.37.0"]
      # ocpp-protocol stays on JUnit 5 until the move is planned in #43.
      - dependency-name: "org.junit*"
        update-types: ["version-update:semver-major"]
      # Stays on the version Spring Modulith is built with.
      - dependency-name: "com.tngtech.archunit*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # Updates the pinned SHAs and their version comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  # Updates the tags and digests of the local stack images.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    ignore:
      # A new PostgreSQL or Keycloak major needs a data migration, so it is planned by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
