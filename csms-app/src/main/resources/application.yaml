spring:
  application:
    name: csms
  threads:
    virtual:
      enabled: true
  jpa:
    # No lazy loading during view rendering: queries stay inside the transaction that needs them.
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Instants are written in UTC whatever the JVM default time zone is.
          time_zone: UTC

logging:
  structured:
    format:
      # JSON by default so containers and CI need no configuration; the dev profile switches back
      # to readable text.
      console: ecs

management:
  endpoint:
    health:
      # Liveness and readiness are enabled by default only on Kubernetes. Docker Compose and load
      # balancers need them too: readiness is false while starting and while shutting down.
      probes:
        enabled: true
